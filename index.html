<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Card Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card-back: #1a1a2e;
      --card-front: #16213e;
      --accent: #00f5ff;
      --accent2: #ff006e;
      --accent3: #8b5cf6;
      --text: #e0e0f0;
      --text-dim: #6b6b8a;
      --glow: 0 0 20px rgba(0,245,255,0.4);
      --glow2: 0 0 20px rgba(255,0,110,0.4);
      --border: rgba(0,245,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 20% 10%, rgba(0,245,255,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(139,92,246,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* HEADER */
    header {
      text-align: center;
      padding-top: 10px;
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--accent), var(--accent3), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(0,245,255,0.5));
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0,245,255,0.5)); }
      50% { filter: drop-shadow(0 0 35px rgba(0,245,255,0.9)); }
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* STATS BAR */
    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 22px;
      text-align: center;
      flex: 1;
      min-width: 90px;
      max-width: 160px;
      position: relative;
      overflow: hidden;
    }

    .stat-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .stat-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
      text-shadow: var(--glow);
      transition: transform 0.15s;
    }

    .stat-value.bump {
      transform: scale(1.3);
    }

    /* DIFFICULTY SELECTOR */
    .difficulty {
      display: flex;
      gap: 8px;
    }

    .diff-btn {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .diff-btn:hover, .diff-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,245,255,0.07);
      box-shadow: var(--glow);
    }

    /* GRID */
    .grid {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .grid.easy   { grid-template-columns: repeat(4, 1fr); }
    .grid.medium { grid-template-columns: repeat(4, 1fr); }
    .grid.hard   { grid-template-columns: repeat(6, 1fr); }

    /* CARD */
    .card {
      aspect-ratio: 1;
      perspective: 800px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 10px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 4vw, 2rem);
    }

    .card-back {
      background: var(--card-back);
      border: 1px solid rgba(0,245,255,0.12);
      position: relative;
      overflow: hidden;
    }

    .card-back::before {
      content: '?';
      font-family: 'Orbitron', monospace;
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 900;
      color: rgba(0,245,255,0.15);
    }

    .card-back::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(0,245,255,0.06);
      border-radius: 7px;
    }

    .card:hover:not(.flipped):not(.matched) .card-back {
      border-color: rgba(0,245,255,0.4);
      box-shadow: inset 0 0 20px rgba(0,245,255,0.08), var(--glow);
    }

    .card-front {
      background: var(--card-front);
      border: 1px solid rgba(0,245,255,0.25);
      transform: rotateY(180deg);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    }

    .card.matched .card-front {
      border-color: var(--accent2);
      box-shadow: 0 0 20px rgba(255,0,110,0.4), inset 0 0 20px rgba(255,0,110,0.1);
      animation: matchedPulse 1s ease-out;
    }

    @keyframes matchedPulse {
      0%   { box-shadow: 0 0 40px rgba(255,0,110,0.8); }
      100% { box-shadow: 0 0 20px rgba(255,0,110,0.4); }
    }

    .card.shake .card-inner {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25%      { transform: rotateY(180deg) translateX(-6px); }
      75%      { transform: rotateY(180deg) translateX(6px); }
    }

    /* CONTROLS */
    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover::before { opacity: 0.1; }
    .btn:hover { box-shadow: var(--glow); }
    .btn:active { transform: scale(0.97); }

    /* WIN OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .overlay.show { display: flex; }

    .win-box {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: var(--glow), 0 0 80px rgba(0,245,255,0.1);
      animation: winPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes winPop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .win-emoji { font-size: 3rem; margin-bottom: 12px; }

    .win-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: var(--glow);
      margin-bottom: 8px;
    }

    .win-stats {
      color: var(--text-dim);
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.8;
    }

    .win-stats span { color: var(--text); font-weight: 600; }

    footer {
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-align: center;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <div class="container">
    <header>
      <div class="title">MEMORY.EXE</div>
      <div class="subtitle">Neural Pattern Recognition</div>
    </header>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moves">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Matches</div>
        <div class="stat-value" id="matches">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">0:00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best">--</div>
      </div>
    </div>

    <div class="difficulty">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>

    <div class="grid easy" id="grid"></div>

    <div class="controls">
      <button class="btn" id="restartBtn">↺ RESTART</button>
    </div>

    <footer>Click cards to flip &nbsp;·&nbsp; Match all pairs to win</footer>
  </div>

  <!-- Win Overlay -->
  <div class="overlay" id="overlay">
    <div class="win-box">
      <div class="win-emoji">🏆</div>
      <div class="win-title">SYSTEM MATCH!</div>
      <div class="win-stats" id="winStats"></div>
      <button class="btn" id="playAgainBtn">▶ PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const SETS = {
      easy:   { pairs: 8,  cols: 'easy' },
      medium: { pairs: 12, cols: 'medium' },
      hard:   { pairs: 18, cols: 'hard' },
    };

    const EMOJIS = [
      '🦊','🐉','🌙','⚡','🔥','🌊','💎','🎯',
      '🚀','🌺','🦋','🎭','🎪','🍄','🐙','🦄',
      '🌈','🎸','🏔️','💀','🎲','🧬','⚗️','🔮',
      '🦅','🐬','🌵','🎋','🦁','🐺','🌸','🍁',
      '🎠','🗿','🧿','💫'
    ];

    let difficulty = 'easy';
    let cards = [], flipped = [], matched = 0, moves = 0;
    let timerInterval = null, seconds = 0, gameStarted = false, locked = false;
    let bestTimes = { easy: null, medium: null, hard: null };

    const grid        = document.getElementById('grid');
    const movesEl     = document.getElementById('moves');
    const matchesEl   = document.getElementById('matches');
    const timerEl     = document.getElementById('timer');
    const bestEl      = document.getElementById('best');
    const overlay     = document.getElementById('overlay');
    const winStats    = document.getElementById('winStats');

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(s) {
      return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }

    function bumpStat(el) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 150);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    function updateBest() {
      const b = bestTimes[difficulty];
      bestEl.textContent = b !== null ? formatTime(b) : '--';
    }

    function initGame() {
      stopTimer();
      seconds = 0; moves = 0; matched = 0;
      gameStarted = false; locked = false; flipped = [];
      timerEl.textContent = '0:00';
      movesEl.textContent = '0';
      matchesEl.textContent = '0';
      overlay.classList.remove('show');
      updateBest();

      const { pairs, cols } = SETS[difficulty];
      const chosen = shuffle([...EMOJIS]).slice(0, pairs);
      cards = shuffle([...chosen, ...chosen]);

      grid.className = `grid ${cols}`;
      grid.innerHTML = '';

      cards.forEach((emoji, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.index = i;
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">${emoji}</div>
          </div>`;
        card.addEventListener('click', onCardClick);
        grid.appendChild(card);
      });
    }

    function onCardClick(e) {
      const card = e.currentTarget;
      if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      if (!gameStarted) { gameStarted = true; startTimer(); }

      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        locked = true;
        moves++;
        movesEl.textContent = moves;
        bumpStat(movesEl);
        checkMatch();
      }
    }

    function checkMatch() {
      const [a, b] = flipped;
      if (a.dataset.emoji === b.dataset.emoji) {
        // Match!
        setTimeout(() => {
          a.classList.add('matched');
          b.classList.add('matched');
          matched++;
          matchesEl.textContent = matched;
          bumpStat(matchesEl);
          flipped = [];
          locked = false;

          const totalPairs = SETS[difficulty].pairs;
          if (matched === totalPairs) onWin(totalPairs);
        }, 400);
      } else {
        // No match — shake and flip back
        setTimeout(() => {
          a.classList.add('shake');
          b.classList.add('shake');
          setTimeout(() => {
            a.classList.remove('flipped', 'shake');
            b.classList.remove('flipped', 'shake');
            flipped = [];
            locked = false;
          }, 400);
        }, 700);
      }
    }

    function onWin(totalPairs) {
      stopTimer();
      if (bestTimes[difficulty] === null || seconds < bestTimes[difficulty]) {
        bestTimes[difficulty] = seconds;
        updateBest();
      }
      winStats.innerHTML = `
        Difficulty: <span>${difficulty.toUpperCase()}</span><br>
        Time: <span>${formatTime(seconds)}</span><br>
        Moves: <span>${moves}</span><br>
        Pairs: <span>${totalPairs}/${totalPairs}</span>
      `;
      setTimeout(() => overlay.classList.add('show'), 400);
    }

    // Difficulty buttons
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        difficulty = btn.dataset.diff;
        initGame();
      });
    });

    document.getElementById('restartBtn').addEventListener('click', initGame);
    document.getElementById('playAgainBtn').addEventListener('click', initGame);

    // Init
    initGame();
  </script>
</body>
</html>
